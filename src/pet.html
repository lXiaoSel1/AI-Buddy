<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self'; connect-src 'none'"><title>AI娘</title><style>
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;font-family:'Segoe UI','Microsoft YaHei',sans-serif}html{width:100%;height:100%}body{width:270px;height:280px;position:relative;contain:layout size;transform:scale(var(--pet-scale,1));transform-origin:0 0}.sprite{position:absolute;left:39px;top:46px;width:192px;height:208px;transform:scale(.86);transform-origin:center;cursor:grab}.sprite canvas{width:192px;height:208px;display:block}
/* status bar: as wide as its text, centred under her; the × only shows while the pointer is on the bar */
.badge{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);box-sizing:border-box;width:max-content;max-width:244px;height:26px;display:flex;align-items:center;gap:6px;padding:0 26px 0 10px;border-radius:13px;background:var(--buddy-surface);color:var(--buddy-text);border:1px solid var(--buddy-border);box-shadow:0 3px 12px var(--buddy-shadow);font-size:11px;letter-spacing:.2px;cursor:pointer}
.badge:hover{border-color:var(--buddy-accent)}
.badge[hidden],.bubble[hidden]{display:none}
.badge-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--buddy-muted)}.badge[data-state=ok] .badge-dot{background:var(--buddy-accent)}.badge[data-state=warn] .badge-dot{background:var(--buddy-warn)}
.badge-spin{flex:none;width:9px;height:9px;border:2px solid color-mix(in srgb,var(--buddy-accent) 25%,transparent);border-top-color:var(--buddy-accent);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.badge .ui-icon{flex:none;color:var(--buddy-accent-text)}
.badge-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.badge-label small{margin-left:4px;font-size:11px;font-weight:400;color:var(--buddy-muted)}
.badge-close{position:absolute;right:3px;top:2px;width:20px;height:20px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:transparent;color:var(--buddy-muted);cursor:pointer;visibility:hidden}.badge:hover .badge-close,.badge:focus-within .badge-close{visibility:visible}
.badge-close:hover{background:color-mix(in srgb,var(--buddy-accent) 15%,transparent);color:var(--buddy-text)}.badge-close:focus-visible{outline:2px solid var(--buddy-accent);outline-offset:-2px}.badge-close:disabled{opacity:.5}
/* bubble: the tail is drawn inside the element's own box, so the click area is exactly what is visible */
.bubble{position:absolute;top:2px;left:12px;right:12px;padding-bottom:9px;cursor:default}
.bubble-box{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-radius:13px;background:var(--buddy-surface);color:var(--buddy-text);border:1px solid var(--buddy-border);box-shadow:0 3px 12px var(--buddy-shadow);font-size:12px;line-height:1.45}
.bubble-tail{position:absolute;left:50%;bottom:2px;width:12px;height:12px;margin-left:-6px;background:var(--buddy-surface);border:1px solid var(--buddy-border);border-top:0;border-left:0;transform:rotate(45deg)}
.bubble-box .ui-icon{flex:none;margin-top:1px;color:var(--buddy-ok)}.bubble[data-kind=info] .ui-icon{color:var(--buddy-accent-text)}
.bubble[data-kind=err] .bubble-box,.bubble[data-kind=err] .bubble-tail{border-color:var(--buddy-err)}.bubble[data-kind=err] .ui-icon{color:var(--buddy-err)}
.bubble[data-open] .bubble-box{cursor:pointer}
.bubble-text{min-width:0;flex:1}.bubble-text b{display:block;font-weight:600}.bubble-text small{display:block;color:var(--buddy-muted);font-size:11px}
.bubble-link{display:block;color:var(--buddy-accent-text);font-size:11px}
.bubble-name{display:block;color:var(--buddy-accent-text);font-size:10px;font-weight:700;letter-spacing:.3px}
.bubble[data-kind=plain] .bubble-box,.bubble[data-kind=say] .bubble-box{display:block;text-align:center}
.bubble-undo{margin-left:8px;padding:0 6px;height:18px;border:0;border-radius:9px;background:color-mix(in srgb,var(--buddy-accent) 18%,transparent);color:var(--buddy-accent-text);font:inherit;font-size:11px;font-weight:600;cursor:pointer}
</style></head><body><div class="bubble" hidden><div class="bubble-box"></div><i class="bubble-tail" aria-hidden="true"></i></div><div class="sprite" aria-label="AI娘桌面宠物"></div><div class="badge" role="button" tabindex="-1"><i class="badge-dot" aria-hidden="true"></i><span class="badge-label">AI 酱<small>· 陪着你</small></span><button class="badge-close" type="button" aria-label="关闭状态条" title="关闭状态条"></button></div><script src="./pet.js"></script></body></html>
