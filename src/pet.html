<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self'; connect-src 'none'"><title>AI娘</title><style>
html,body{margin:0;background:transparent;overflow:hidden;user-select:none;font-family:'Segoe UI','Microsoft YaHei',sans-serif}html{width:100%;height:100%}body{width:270px;height:280px;position:relative;contain:layout size;transform:scale(var(--pet-scale,1));transform-origin:0 0}.sprite{position:absolute;left:39px;top:46px;width:192px;height:208px;transform:scale(.86);transform-origin:center;cursor:grab}.sprite canvas{width:192px;height:208px;display:block}.badge{position:absolute;bottom:8px;left:20px;right:20px;height:27px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:color-mix(in srgb,var(--buddy-surface) 92%,transparent);border:1px solid color-mix(in srgb,var(--buddy-accent-text) 38%,transparent);box-shadow:0 3px 12px #05142955;font-size:11px;color:var(--buddy-accent-text);cursor:pointer;letter-spacing:.3px}.bubble{position:absolute;top:4px;left:10px;right:10px;padding:9px 13px;border-radius:14px;background:color-mix(in srgb,var(--buddy-surface) 95%,transparent);color:var(--buddy-accent-text);font-size:12px;text-align:center;box-shadow:0 3px 12px #04162b33}.bubble[hidden],.badge[hidden]{display:none}
.badge{box-sizing:border-box;padding:0 29px}.badge-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge-close{position:absolute;right:2px;top:1px;width:24px;height:23px;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:transparent;color:inherit;font:18px/1 'Segoe UI',sans-serif;cursor:pointer}.badge-close:hover{background:color-mix(in srgb,var(--buddy-accent) 15%,transparent)}.badge-close:focus-visible{outline:2px solid currentColor;outline-offset:-3px}.badge-close:disabled{opacity:.5}
.badge,.bubble{background:var(--buddy-surface);color:var(--buddy-text);border:1px solid var(--buddy-border);box-shadow:0 3px 12px var(--buddy-shadow)}
</style></head><body><div class="bubble" hidden></div><div class="sprite" aria-label="AI娘桌面宠物"></div><div class="badge"><span class="badge-label">AI娘 · 离线陪伴</span><button class="badge-close" type="button" aria-label="关闭状态条" title="关闭状态条">×</button></div><script src="./pet.js"></script></body></html>
