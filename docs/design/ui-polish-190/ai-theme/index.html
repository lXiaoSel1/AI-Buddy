<title>AI 酱角色主题</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Cinzel:wght@600&family=IBM+Plex+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@600;700&family=Oswald:wght@500&family=Quicksand:wght@600;700&display=swap">
<style>
/* Layout: quiet studio page; each theme is shown as a recreated AI 酱 window (workspace + Galgame + desktop pet) with its spec sheet beside it. */
:root{
  --pg-bg:#ECEDF1;--pg-surface:#FFFFFF;--pg-raised:#F5F6F8;--pg-text:#16171B;--pg-muted:#575A65;--pg-line:#D6D8DF;
  --pg-ink:#1D1F25;--pg-on-ink:#FFFFFF;--pg-good:#1B7550;--pg-warn:#9A5B00;--pg-bad:#B0302B;
  --pg-desk:linear-gradient(160deg,#DDE1E8,#C4CAD5);--pg-shadow:0 24px 60px -30px rgba(20,24,34,.45);
  --pg-sans:"Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --pg-serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --pg-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pg-bg:#111216;--pg-surface:#1A1B20;--pg-raised:#22232A;--pg-text:#ECEDF1;--pg-muted:#A0A3AE;--pg-line:#2E3038;
  --pg-ink:#ECEDF1;--pg-on-ink:#15161A;--pg-good:#6FCB9C;--pg-warn:#E8B45E;--pg-bad:#FF8F88;
  --pg-desk:linear-gradient(160deg,#272A33,#16181D);--pg-shadow:0 24px 60px -30px rgba(0,0,0,.85);color-scheme:dark}}
:root[data-theme="dark"]{
  --pg-bg:#111216;--pg-surface:#1A1B20;--pg-raised:#22232A;--pg-text:#ECEDF1;--pg-muted:#A0A3AE;--pg-line:#2E3038;
  --pg-ink:#ECEDF1;--pg-on-ink:#15161A;--pg-good:#6FCB9C;--pg-warn:#E8B45E;--pg-bad:#FF8F88;
  --pg-desk:linear-gradient(160deg,#272A33,#16181D);--pg-shadow:0 24px 60px -30px rgba(0,0,0,.85);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--pg-bg);color:var(--pg-text);font-family:var(--pg-sans);font-size:14px;line-height:1.55}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pg-ink);outline-offset:2px}

/* ---------- page header ---------- */
.pg-head{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;justify-content:space-between;padding-block:28px 18px}
::selection{background:color-mix(in srgb,var(--pg-ink) 16%,transparent)}
html{scrollbar-color:var(--pg-line) transparent;accent-color:var(--pg-ink)}
.pg-head h1{margin:0;font-family:var(--pg-serif);font-size:clamp(26px,3.4vw,38px);font-weight:700;line-height:1.15;text-wrap:balance}
.pg-head .lede{margin:10px 0 0;max-width:62ch;color:var(--pg-muted)}
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;min-width:0}
.tally .count{font-family:var(--pg-mono);font-size:13px;color:var(--pg-muted)}
.tally .count b{font-size:22px;color:var(--pg-text);font-weight:500}
.pg-btn{appearance:none;border:1px solid var(--pg-line);background:var(--pg-surface);border-radius:999px;padding:7px 16px;cursor:pointer}
.pg-btn:hover{border-color:var(--pg-muted)}
.pg-btn.ink{background:var(--pg-ink);color:var(--pg-on-ink);border-color:var(--pg-ink)}
.pg-check{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.pg-check input{width:16px;height:16px;margin:0}
.store-note{flex-basis:100%;margin:0;font-size:12px;color:var(--pg-muted);max-width:52ch}
#copy-out{width:100%;min-height:150px;margin-top:8px;font-family:var(--pg-mono);font-size:12px;background:var(--pg-surface);color:var(--pg-text);border:1px solid var(--pg-line);border-radius:8px;padding:10px}

/* ---------- switcher ---------- */
.switcher{display:flex;flex-wrap:wrap;gap:8px;padding-block:6px 22px}
.sw{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid var(--pg-line);background:var(--pg-surface);color:var(--pg-text);text-decoration:none;font-size:13px;white-space:nowrap}
.sw:hover{border-color:var(--pg-muted)}
.sw[aria-current="page"]{background:var(--pg-ink);color:var(--pg-on-ink);border-color:var(--pg-ink)}
.sw .face{width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--ring,transparent);background:var(--pg-raised)}
.sw .face img{width:100%;height:100%;object-fit:cover;transform:scale(1.9);transform-origin:50% 14%}
.sw .all{display:grid;place-items:center}
.sw .mk{width:7px;height:7px;border-radius:50%;background:transparent}
.sw .mk.like{background:var(--pg-good)}.sw .mk.change{background:var(--pg-warn)}
@media (max-width:640px){.switcher{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}}

/* ---------- overview ---------- */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.ovc{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;min-width:0}
.mini-frame{position:relative;aspect-ratio:1000/620;max-width:100%;overflow:hidden;border-radius:10px;box-shadow:var(--pg-shadow);transition:transform .18s ease}
.ovc:hover .mini-frame{transform:translateY(-3px)}
.mini-inner{position:absolute;left:0;top:0;width:1000px;height:620px;transform:scale(var(--s,.3));transform-origin:0 0;pointer-events:none}
.mini-inner .win{height:620px;border-radius:0;box-shadow:none}
.ovc-meta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ovc-meta b{font-size:15px}
.ovc-meta .sub{color:var(--pg-muted);font-size:13px}
.vb{margin-left:auto;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--pg-line);color:var(--pg-muted)}
.vb.like{color:var(--pg-good);border-color:currentColor}.vb.change{color:var(--pg-warn);border-color:currentColor}
.ovc-sw{display:flex;height:8px;border-radius:4px;overflow:hidden}
.ovc-sw i{flex:1}
.sumcard{border:1px dashed var(--pg-line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:10px;background:var(--pg-surface)}
.sumcard h2{margin:0;font-family:var(--pg-serif);font-size:20px}
.sumcard p{margin:0;color:var(--pg-muted)}
.sumcard ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.sumcard li{display:flex;gap:8px}
.sumcard li span:last-child{margin-left:auto;color:var(--pg-muted)}

/* ---------- detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:28px;align-items:start}
.mocks{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.mocks>*,.row2>*{min-width:0}
.row2{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:22px}
.cap{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--pg-muted)}
.info{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;background:var(--pg-surface);border:1px solid var(--pg-line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.info h2{margin:0;font-family:var(--pg-serif);font-size:24px;line-height:1.2}
.info h2 small{font-size:15px;color:var(--pg-muted);margin-left:6px}
.info h3{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--pg-muted)}
.info p{margin:0}
.info-head{display:flex;gap:12px;align-items:center}
.info-head .face{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;background:var(--pg-raised);box-shadow:0 0 0 2px var(--ring)}
.info-head .face img{width:100%;height:100%;object-fit:cover;transform:scale(1.9);transform-origin:50% 14%}
.mode{display:inline-block;margin-top:4px;font-size:12px;line-height:1.3;padding:4px 10px;border-radius:999px;border:1px solid var(--pg-line);color:var(--pg-muted)}
.vbtns{display:flex;gap:8px}
.vbtn{flex:1;appearance:none;border:1px solid var(--pg-line);background:var(--pg-raised);border-radius:8px;padding:8px 0;cursor:pointer;font-weight:600}
.vbtn[aria-pressed="true"][data-v="like"]{background:var(--pg-good);border-color:var(--pg-good);color:var(--pg-surface)}
.vbtn[aria-pressed="true"][data-v="change"]{background:var(--pg-warn);border-color:var(--pg-warn);color:var(--pg-surface)}
#note{width:100%;min-height:72px;margin-top:8px;resize:vertical;font:inherit;font-size:13px;background:var(--pg-raised);color:var(--pg-text);border:1px solid var(--pg-line);border-radius:8px;padding:8px 10px;caret-color:var(--pg-ink)}
#note::placeholder{color:var(--pg-muted)}
.vstatus{font-size:12px;color:var(--pg-muted);margin-top:4px!important}
.obtns{display:grid;gap:6px}
.obtn{appearance:none;display:grid;gap:2px;text-align:left;padding:8px 12px;border:1px solid var(--pg-line);border-radius:8px;background:var(--pg-raised);cursor:pointer}
.obtn:hover{border-color:var(--pg-muted)}
.obtn[aria-checked="true"]{border-color:var(--pg-ink);box-shadow:inset 0 0 0 1px var(--pg-ink);background:var(--pg-surface)}
.obtn b{display:flex;align-items:center;gap:8px;font-size:13px}
.obtn b small{font-size:11px;font-weight:500;color:var(--pg-muted);border:1px solid var(--pg-line);border-radius:999px;padding:0 6px}
.obtn span{font-size:12px;color:var(--pg-muted)}
.pal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.pal li{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px}
.pal i{width:22px;height:22px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.pal span{color:var(--pg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal code{margin-left:auto;font-family:var(--pg-mono);font-size:11px}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:12px}
.cmp .bar{display:flex;height:16px;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.cmp .bar i{flex:1}
.now-shot{width:100%;border-radius:6px;border:1px solid var(--pg-line);margin-top:8px;display:block}
.deco{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.ct{width:100%;border-collapse:collapse;font-size:12px}
.ct td{padding:3px 0;border-bottom:1px solid var(--pg-line)}
.ct td:nth-child(2),.ct td:nth-child(3){text-align:right;font-family:var(--pg-mono);font-variant-numeric:tabular-nums;padding-left:8px}
.ct .pass{color:var(--pg-good)}.ct .fail{color:var(--pg-bad);font-weight:700}
.ct-sum{font-size:12px;margin-bottom:6px!important}
.pn{display:flex;gap:8px}
.pn a{flex:1;text-align:center;text-decoration:none;color:inherit;border:1px solid var(--pg-line);border-radius:8px;padding:7px 0;font-size:13px}
.pn a:hover{border-color:var(--pg-muted)}
.desk{position:relative;border-radius:14px;background:var(--pg-desk);min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px 12px 14px;gap:6px;overflow:hidden}
.foot{padding-block:36px 40px;color:var(--pg-muted);font-size:12px}
.ct-sum.pass{color:var(--pg-good)}.ct-sum.fail{color:var(--pg-bad);font-weight:700}
@media (max-width:1180px){.detail{grid-template-columns:minmax(0,1fr)}.info{position:static;max-height:none}}
@media (max-width:780px){.row2{grid-template-columns:minmax(0,1fr)}}

/* =========================================================
   Recreated AI 酱 UI — every color comes from the theme scope
   Type roles: cap 11 · sm 12 · body 13 · title 15 · lg 18 · xl 22 · num 26 · display 28
   Space scale: 4 · 8 · 12 · 16 · 20 · 24 · 32
   ========================================================= */
.tscope{--f-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --fs-cap:11px;--fs-sm:12px;--fs-body:13px;--fs-title:15px;--fs-lg:18px;--fs-xl:22px;--fs-num:26px;--fs-display:28px;
  --r-btn-s:min(var(--r-btn),10px);--ease:cubic-bezier(.2,.7,.2,1);
  font-family:var(--f-ui);color:var(--text);font-size:var(--fs-body);line-height:1.5;-webkit-font-smoothing:antialiased}
.tscope ::selection{background:color-mix(in srgb,var(--accent) 32%,transparent)}
.tscope h2,.tscope h3{margin:0}
.win{background:var(--bg);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--pg-shadow);container-type:inline-size;container-name:win;display:flex;flex-direction:column}
.win-bar{display:flex;align-items:center;gap:8px;height:32px;flex:none;padding-left:12px;background:var(--chrome);color:var(--side-text);font-size:var(--fs-sm)}
.win-bar .face{width:16px;height:16px;border-radius:50%;overflow:hidden;flex:none}
.win-bar .face img{width:100%;height:100%;object-fit:cover;transform:scale(1.9);transform-origin:50% 14%}
.ctl{margin-left:auto;display:flex;align-self:stretch}
.ctl i{display:grid;place-items:center;width:46px;opacity:.72}
.ctl svg{display:block}
.strip{height:1px;flex:none;background:var(--border)}
.app-body{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr)}
.side{position:relative;z-index:2;background-color:var(--side-bg);color:var(--side-text);padding:20px 12px 16px;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo b{display:block;font-family:var(--f-head);font-size:var(--fs-lg);font-weight:700;line-height:1.15}
.logo small{display:block;margin-top:2px;font-size:var(--fs-cap);letter-spacing:.04em;color:var(--side-muted)}
.ava{position:relative;flex:none;width:40px;height:40px}
.ava .face{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--surface2);box-shadow:0 0 0 1px var(--border)}
.ava .face img{width:100%;height:100%;object-fit:cover;transform:scale(1.9);transform-origin:50% 14%}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{position:relative;display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:var(--r-btn-s);color:var(--side-muted);font-size:var(--fs-body);cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.ni svg{flex:none}
.ni:hover{background:color-mix(in srgb,var(--side-text) 7%,transparent);color:var(--side-text)}
.ni.on{background:var(--side-active);color:var(--side-accent);font-weight:600}
.ni.on::before{content:"";position:absolute;left:0;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:var(--side-accent)}
.side-foot{margin-top:auto;padding:0 8px;display:grid;gap:2px;font-size:var(--fs-cap);color:var(--side-muted)}
.side-foot b{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:500;color:var(--side-text)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.main{min-width:0;background-color:var(--bg);display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;flex:none;padding:0 24px;border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.top-r{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-size:var(--fs-sm);font-weight:500;white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 35%,transparent)}
.pill.err{color:var(--err);background:color-mix(in srgb,var(--err) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--err) 35%,transparent)}
.pill .dot{background:currentColor}
.content{padding:24px;display:flex;flex-direction:column;gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:28px 32px;overflow:hidden;min-height:232px}
.hero>*{position:relative;z-index:1}
.hero-txt{display:flex;flex-direction:column;min-width:0}
.eyebrow{display:flex;align-items:center;font-family:var(--f-head);font-size:var(--fs-title);font-weight:700;color:var(--text)}
.slogan{margin-top:8px;font-family:var(--f-head);font-size:var(--fs-display);font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--text);text-wrap:balance}
.slogan .ph{display:inline-block}
.meta{margin:8px 0 0;font-size:var(--fs-sm);color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:auto;padding-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 16px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--r-btn);font-size:var(--fs-body);font-weight:500;white-space:nowrap;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease),filter .15s var(--ease)}
.btn:hover{background:color-mix(in srgb,var(--text) 7%,var(--surface2))}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--accent-hover)}
.hero-art{position:relative;align-self:end;margin:-12px -8px -28px 0}
.hero-art img{display:block;height:248px;width:auto;position:relative}
.tabs{display:flex;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.tab{display:inline-flex;align-items:center;height:32px;padding:0 24px;border-radius:var(--r-btn);border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:var(--fs-sm);cursor:pointer;transition:border-color .15s var(--ease),color .15s var(--ease)}
.tab:hover{color:var(--text);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.tab.on{color:var(--accent-text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stat{padding:16px 20px 20px;display:flex;flex-direction:column}
.stat h3{font-size:var(--fs-body);font-weight:600}
.num{margin-top:8px;font-family:var(--f-ui);font-size:var(--fs-num);font-weight:600;line-height:1.15;letter-spacing:-.015em;color:var(--accent-text);font-variant-numeric:tabular-nums}
.num .u{font-size:.62em;font-weight:500;letter-spacing:0;margin:0 1px}
.stat small{margin-top:4px;font-size:var(--fs-cap);color:var(--muted)}
.meter{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden;margin-top:12px}
.meter b{display:block;height:100%;width:68%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--bar-end))}
.sec{display:flex;align-items:center;margin-bottom:8px;font-family:var(--f-head);font-size:var(--fs-title);font-weight:700}
.recent{padding:16px 20px 4px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--border)}
.rrow:first-of-type{border-top:0}
.rrow b{display:block;font-size:var(--fs-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow small{display:block;margin-top:2px;font-size:var(--fs-cap);color:var(--muted)}
.rrow .pill{justify-self:end}
.rrow time{font-size:var(--fs-cap);color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-bottom:4px}
.ptitle{font-family:var(--f-head);font-size:var(--fs-num);font-weight:700;line-height:1.2}
.page-head .meta{margin-top:4px}
.saved{font-size:var(--fs-sm);color:var(--ok)}
.set{padding:20px 24px 4px}
.srow{display:flex;align-items:center;gap:16px;justify-content:space-between;min-height:56px;padding:12px 0;border-top:1px solid var(--border)}
.srow>div{min-width:0}
.srow b{display:block;font-size:var(--fs-body);font-weight:600}
.srow small{display:block;margin-top:2px;font-size:var(--fs-cap);color:var(--muted)}
.select{display:inline-flex;align-items:center;justify-content:space-between;gap:12px;height:32px;min-width:112px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r-btn-s);background:var(--surface2);font-size:var(--fs-sm);white-space:nowrap;cursor:pointer;transition:border-color .15s var(--ease)}
.select:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.select::after{content:"";flex:none;width:6px;height:6px;margin-top:-3px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
.select.wide{display:flex;width:100%}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid color-mix(in srgb,var(--text) 40%,var(--surface));background:var(--surface);flex:none;display:grid;place-items:center}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:5px;height:9px;margin-top:-2px;border-right:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:rotate(45deg)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:12px 0 16px;border-top:1px solid var(--border)}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--r-btn-s);border:1px solid var(--border);background:var(--surface);font-size:var(--fs-sm);white-space:nowrap;cursor:pointer;transition:border-color .15s var(--ease)}
.chip:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent-text);font-weight:600}
.trio{display:flex;width:24px;height:14px;border-radius:4px;overflow:hidden;flex:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--text) 18%,transparent)}
.trio b{flex:1}
.set2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.set-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:8px}
.set-head small{display:block;font-size:var(--fs-cap);color:var(--muted)}
.set-head img{height:88px;width:auto;margin:-8px -4px -4px 0}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}

/* Galgame */
.stage{position:relative;aspect-ratio:16/10.4;background-size:cover;background-position:center;overflow:hidden}
.stage-top{position:absolute;left:16px;right:16px;top:12px;z-index:3;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:var(--fs-cap);background:color-mix(in srgb,var(--dlg-bg) 84%,transparent);color:var(--dlg-text);box-shadow:inset 0 0 0 1px var(--dlg-border);backdrop-filter:blur(6px)}
.gchip.title{height:28px;padding:0 12px;font-family:var(--f-head);font-size:var(--fs-body);font-weight:700}
.stand{position:absolute;left:50%;bottom:0;height:94%;transform:translateX(-50%);z-index:1}
.dlg{position:absolute;z-index:2;left:24px;right:24px;bottom:20px;padding:28px 24px 16px;background:color-mix(in srgb,var(--dlg-bg) 94%,transparent);color:var(--dlg-text);border:1px solid var(--dlg-border);border-radius:var(--r-dlg);backdrop-filter:blur(8px);box-shadow:0 16px 36px -18px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:12px}
.plate{position:absolute;z-index:3;top:-15px;left:24px;display:inline-flex;align-items:center;height:30px;padding:0 20px;border-radius:999px;background:var(--plate-bg);color:var(--plate-text);font-family:var(--f-head);font-weight:700;font-size:var(--fs-title);letter-spacing:.12em}
.lvl{position:absolute;top:12px;right:20px;display:flex;align-items:center;gap:8px;font-size:var(--fs-cap);color:var(--dlg-muted);font-variant-numeric:tabular-nums}
.lvl i{display:block;width:96px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--dlg-text) 16%,transparent);overflow:hidden}
.lvl i b{display:block;height:100%;width:60%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--bar-end))}
.line{margin:0;font-size:var(--fs-lg);font-weight:500;line-height:1.5}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{display:flex;align-items:center;height:36px;padding:0 16px;border-radius:var(--r-btn-s);background:var(--choice-bg);box-shadow:inset 0 0 0 1px var(--dlg-border);font-size:var(--fs-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:background-color .15s var(--ease)}
.choice:hover{background:color-mix(in srgb,var(--accent) 18%,var(--choice-bg))}
.say{display:flex;gap:8px}
.inp{flex:1;min-width:0;display:flex;align-items:center;height:36px;padding:0 16px;border-radius:var(--r-btn-s);background:color-mix(in srgb,var(--dlg-text) 6%,var(--dlg-bg));box-shadow:inset 0 0 0 1px var(--dlg-border);color:var(--dlg-muted);font-size:var(--fs-body);white-space:nowrap;overflow:hidden}
.say .btn{height:36px}

/* Desktop pet */
.bubble{position:relative;padding:10px 14px 12px;max-width:200px;font-size:var(--fs-sm);box-shadow:0 8px 20px -12px rgba(0,0,0,.45)}
.bubble b{display:block;font-family:var(--f-head);font-size:var(--fs-title);line-height:1.3}
.bubble small{display:block;margin-top:2px;font-size:var(--fs-cap);color:var(--muted)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;background:var(--surface);border-style:solid;border-width:0 1px 1px 0;border-color:inherit;border-bottom-right-radius:2px;transform:rotate(45deg)}
.pet{height:184px;width:auto;display:block;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;background:var(--chrome);color:var(--side-text);box-shadow:inset 0 0 0 1px var(--border);font-size:var(--fs-cap)}
.desk .cap{position:absolute;left:12px;top:10px;margin:0}

.hero::before,.hero::after,.dlg::before,.dlg::after,.side::after,.hero-art::before{pointer-events:none}

@container win (max-width:720px){
  .app-body{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto}
  .logo{padding:0}.logo div{display:none}.ava{width:32px;height:32px}
  .nav{flex-direction:row;gap:2px}
  .ni{width:36px;padding:0;justify-content:center}.ni span{display:none}
  .ni.on::before{left:50%;top:auto;bottom:2px;width:16px;height:3px;margin:0 0 0 -8px}
  .side-foot{display:none}
  .top{height:44px;padding:0 16px}.top>span{display:none}.top-r{margin-left:auto}
  .content{padding:16px;gap:12px}
  .hero{grid-template-columns:minmax(0,1fr) 96px;padding:20px;min-height:0}
  .slogan{font-size:var(--fs-lg)}
  .hero-art{margin:-8px -8px -24px 0}.hero-art img{height:168px}
  .tab{padding:0 16px}
  .stats,.set2{grid-template-columns:minmax(0,1fr)}
  .ptitle{font-size:var(--fs-xl)}
  .set{padding:16px 16px 4px}
  .srow{flex-wrap:wrap}
  .rrow{grid-template-columns:minmax(0,1fr) auto}.rrow time{display:none}
  .stage{aspect-ratio:3/4.3}
  .dlg{left:12px;right:12px;bottom:12px;padding:20px 16px 12px}
  .choices{grid-template-columns:minmax(0,1fr)}
  .lvl{position:static;justify-content:flex-end}
  .line{font-size:var(--fs-title)}
}

/* =========================================================
   Per-character ornaments (the "明显" level) — one authored
   motif family per character, drawn as SVG/CSS shapes; no glows,
   no glyph icons, no gradient text.
   ========================================================= */
/* DeepSeek — deep sea maid: bubbles, hairline lace */
[data-t="deepseek"] .main{background-image:var(--pat-main)}
[data-t="deepseek"] .plate{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
/* variant B: one maid bow pinned to the overview card and the name plate */
[data-t="deepseek"][data-o="bow"] .hero::before{content:"";position:absolute;left:50%;top:-3px;width:56px;height:28px;margin-left:-28px;background:var(--orn-bow) center/contain no-repeat}
[data-t="deepseek"][data-o="bow"] .plate::after{content:"";position:absolute;right:-12px;top:-9px;width:28px;height:14px;background:var(--orn-bow) center/contain no-repeat;transform:rotate(14deg)}
/* variant C: one faint whale-fluke line drawing beside the portrait */
[data-t="deepseek"][data-o="tail"] .hero::before{content:"";position:absolute;right:172px;bottom:-24px;width:200px;height:155px;background:var(--orn-tail) center/contain no-repeat}

/* Grok — gothic rose: gold hairlines, corner filigree */
[data-t="grok"] .main{background-image:var(--pat-main)}
[data-t="grok"] .card{border-color:rgba(207,169,92,.34);box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px rgba(207,169,92,.16)}
[data-t="grok"] .ni.on{background:linear-gradient(90deg,rgba(200,50,77,.32),rgba(200,50,77,.06))}
[data-t="grok"] .ni.on::before{left:-1px;width:7px;height:7px;margin-top:-3.5px;border-radius:0;background:var(--a2);transform:rotate(45deg)}
[data-t="grok"] .sec::before{content:"";width:6px;height:6px;background:var(--a2);transform:rotate(45deg);margin-right:8px;flex:none}
[data-t="grok"] .slogan::after{content:"";display:block;width:150px;height:1px;margin-top:12px;background:linear-gradient(90deg,var(--a2),transparent)}
[data-t="grok"] .btn.primary{box-shadow:inset 0 0 0 1px rgba(207,169,92,.6)}
[data-t="grok"] .plate{border-radius:3px;box-shadow:inset 0 0 0 1px var(--a2);letter-spacing:.2em}
/* variant B: a single gold rose-and-thorn vine replaces the plain rule under the slogan */
[data-t="grok"][data-o="rose"] .slogan::after{width:210px;height:21px;margin-top:8px;background:var(--orn-rose) left center/contain no-repeat}
/* variant C: a small bat-wing crest before the page title and on the name plate */
[data-t="grok"][data-o="wing"] .eyebrow::before{content:"";width:28px;height:14px;margin-right:8px;flex:none;background:var(--orn-wing) center/contain no-repeat}
[data-t="grok"][data-o="wing"] .plate::before{content:"";width:24px;height:12px;margin-right:8px;flex:none;background:var(--orn-wing) center/contain no-repeat}

/* Seed — sporty tech: gradient strip, dot grid, gradient ring */
[data-t="seed"] .strip{height:3px;background:linear-gradient(90deg,var(--accent),#2F63E8 55%,var(--a2))}
[data-t="seed"] .main{background-image:var(--pat-main)}
[data-t="seed"] .hero-art::before{content:"";position:absolute;width:200px;height:200px;right:-16px;top:28px;border-radius:50%;border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(135deg,var(--accent),var(--a2)) border-box;opacity:.6;z-index:-1}
[data-t="seed"] .btn.primary,[data-t="seed"] .plate{background:linear-gradient(90deg,var(--accent),#2F63E8)}
[data-t="seed"] .btn.primary:hover{filter:brightness(1.08)}
[data-t="seed"] .ni.on{background:linear-gradient(90deg,#EEEAFE,#E2F6F6)}
[data-t="seed"] .ni.on::before{background:linear-gradient(var(--accent),var(--a2))}
/* Kimi — starry night: stars, constellations, prism line */
[data-t="kimi"] .main,[data-t="kimi"] .side{background-image:var(--pat-main)}
[data-t="kimi"] .hero::before,[data-t="kimi"] .dlg::before{content:"";position:absolute;left:24px;right:24px;top:-1px;height:2px;border-radius:2px;background:var(--prism);opacity:.9}
[data-t="kimi"] .slogan::after{content:"";display:block;width:120px;height:2px;margin-top:12px;border-radius:2px;background:var(--prism)}
[data-t="kimi"] .ni.on{box-shadow:inset 0 0 0 1px rgba(221,225,242,.18)}
[data-t="kimi"] .ni.on::before{content:none}
[data-t="kimi"] .ni.on::after{content:"";position:absolute;right:12px;top:50%;width:10px;height:10px;margin-top:-5px;background:var(--orn-star) center/contain no-repeat}
[data-t="kimi"] .card{box-shadow:0 14px 30px -20px rgba(0,0,0,.7)}

/* Qwen — blue-and-white porcelain: key-fret band, scrolls, tassel */
[data-t="qwen"] .main{background-image:var(--pat-main)}
/* variant B: a hairline finished with three fret units at each end only */
[data-t="qwen"][data-o="ends"] .hero,[data-t="qwen"][data-o="ruyi"] .hero{padding-top:40px}
[data-t="qwen"][data-o="ends"] .hero::before,[data-t="qwen"][data-o="ends"] .dlg::before{content:"";position:absolute;left:16px;right:16px;top:14px;height:12px;background:var(--orn-fret-l) left center/36px 12px no-repeat,var(--orn-fret-r) right center/36px 12px no-repeat,linear-gradient(rgba(42,73,174,.45),rgba(42,73,174,.45)) center/calc(100% - 80px) 1px no-repeat}
[data-t="qwen"][data-o="ends"] .dlg::before{top:auto;bottom:10px;left:20px;right:20px}
/* variant C: one ruyi cloud head centered on a fading hairline */
[data-t="qwen"][data-o="ruyi"] .hero::before{content:"";position:absolute;left:32px;right:32px;top:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(42,73,174,.4) 30%,rgba(42,73,174,.4) 70%,transparent)}
[data-t="qwen"][data-o="ruyi"] .hero::after{content:"";position:absolute;left:50%;top:7px;width:68px;height:27px;margin-left:-34px;background:var(--orn-ruyi) center/contain no-repeat}
[data-t="qwen"][data-o="ruyi"] .dlg::before{content:"";position:absolute;left:50%;bottom:6px;width:50px;height:20px;margin-left:-25px;background:var(--orn-ruyi) center/contain no-repeat}
[data-t="qwen"][data-o="ends"] .dlg,[data-t="qwen"][data-o="ruyi"] .dlg{padding-bottom:32px}
[data-t="qwen"] .ni.on::before{content:none}
[data-t="qwen"] .ni.on::after{content:"";position:absolute;right:12px;top:50%;width:10px;height:26px;margin-top:-6px;background:var(--orn-tassel) no-repeat}
[data-t="qwen"] .sec::before,[data-t="qwen"] .eyebrow::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;background:var(--accent);transform:rotate(45deg);flex:none}
[data-t="qwen"] .hero-art::before{content:"";position:absolute;width:248px;height:248px;right:-40px;top:8px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 15px,rgba(42,73,174,.11) 15px 16px);z-index:-1}
[data-t="qwen"] .plate{box-shadow:0 0 0 2px var(--dlg-bg),0 0 0 3px var(--a2);border-radius:4px}

/* MiniMax — field reporter: plaid, film perforations, clapper tag */
[data-t="minimax"] .main{background-image:repeating-linear-gradient(0deg,rgba(200,169,126,.14) 0 2px,transparent 2px 30px),repeating-linear-gradient(90deg,rgba(200,169,126,.14) 0 2px,transparent 2px 30px),repeating-linear-gradient(0deg,rgba(231,121,154,.06) 0 12px,transparent 12px 60px),repeating-linear-gradient(90deg,rgba(231,121,154,.06) 0 12px,transparent 12px 60px)}
[data-t="minimax"] .hero{padding-left:52px}
[data-t="minimax"] .hero::before,[data-t="minimax"] .dlg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;border-radius:calc(var(--r-card) - 1px) 0 0 calc(var(--r-card) - 1px);background:var(--orn-film) 0 0/18px 20px repeat-y}
[data-t="minimax"] .dlg{padding-left:40px}
[data-t="minimax"] .dlg::before{border-radius:calc(var(--r-dlg) - 1px) 0 0 calc(var(--r-dlg) - 1px)}
[data-t="minimax"] .eyebrow::before{content:"";display:inline-block;width:28px;height:12px;margin-right:8px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--text) 0 4px,var(--surface) 4px 8px);flex:none}
[data-t="minimax"] .plate::before{content:"";width:6px;height:6px;margin-right:8px;border-radius:50%;background:#FFD7CF;flex:none}

/* GPT — white dragon: scales, silver lines, pearl */
[data-t="chatgpt"] .main{background-image:var(--pat-main)}
[data-t="chatgpt"] .card{box-shadow:0 12px 30px -24px rgba(94,86,168,.45)}
[data-t="chatgpt"] .hero{box-shadow:inset 0 0 0 6px var(--surface),inset 0 0 0 7px var(--a2),0 12px 30px -24px rgba(94,86,168,.45)}
[data-t="chatgpt"] .hero-art::before{content:"";position:absolute;width:188px;height:188px;right:-12px;top:32px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#FFFFFF 0 10%,#F1EFFB 36%,#E3DFF6 100%);box-shadow:inset 0 0 0 1px rgba(196,195,214,.7);z-index:-1}
[data-t="chatgpt"] .slogan{font-weight:600;letter-spacing:.01em}
[data-t="chatgpt"] .slogan::after{content:"";display:block;width:56px;height:1px;margin-top:16px;background:var(--a2)}
[data-t="chatgpt"] .ni.on::before{left:6px;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:var(--accent)}

/* Gemini — starlight cat: sparkles, iridescence, cat ears */
[data-t="gemini"] .main,[data-t="gemini"] .side{background-image:var(--pat-main)}
[data-t="gemini"] .tab.on,[data-t="gemini"] .chip.on{border-color:transparent;background:linear-gradient(var(--surface2),var(--surface2)) padding-box,var(--iri) border-box}
[data-t="gemini"] .slogan::after{content:"";display:block;width:128px;height:3px;margin-top:12px;border-radius:3px;background:var(--iri)}
[data-t="gemini"] .ni.on::before{background:linear-gradient(#4FA8FF,#FF8AD8)}
[data-t="gemini"] .ava::before,[data-t="gemini"] .ava::after,[data-t="gemini"] .plate::before,[data-t="gemini"] .plate::after{content:"";position:absolute;top:-8px;width:15px;height:14px;background:linear-gradient(180deg,#FF8AD8,#8C7DFF);clip-path:polygon(50% 0,100% 100%,0 100%)}
[data-t="gemini"] .ava::before{left:0;transform:rotate(-24deg)}
[data-t="gemini"] .ava::after{right:0;transform:rotate(24deg)}
[data-t="gemini"] .plate::before{left:12px;transform:rotate(-18deg)}
[data-t="gemini"] .plate::after{right:12px;transform:rotate(18deg)}
[data-t="gemini"] .plate{top:-13px}
[data-t="gemini"] .dlg{border-color:transparent;background:linear-gradient(var(--dlg-bg),var(--dlg-bg)) padding-box,var(--iri) border-box}
[data-t="gemini"] .sec::before{content:"";width:11px;height:11px;margin-right:8px;flex:none;background:var(--orn-star) center/contain no-repeat}
[data-t="gemini"] .hero-art::before{content:"";position:absolute;inset:0 -24px 24px;background:var(--orn-sparkles) center/contain no-repeat;z-index:-1}

/* Claude — ivory pages: paper grain, gold double rules, ribbon, flower */
[data-t="claude"] .main,[data-t="claude"] .side{background-image:var(--pat-main)}
[data-t="claude"] .card{border-color:rgba(176,138,69,.6);box-shadow:inset 0 0 0 4px var(--surface),inset 0 0 0 5px rgba(176,138,69,.5)}
[data-t="claude"] .hero{padding-left:64px}
[data-t="claude"] .hero::after{content:"";position:absolute;top:-1px;left:24px;width:18px;height:60px;z-index:2;background:var(--a2);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
[data-t="claude"] .sec::before,[data-t="claude"] .eyebrow::before{content:"";display:inline-block;width:15px;height:15px;margin-right:8px;background:var(--orn-flower) center/contain no-repeat;flex:none}
[data-t="claude"] .ni.on::before{background:var(--a2)}
[data-t="claude"] .dlg{box-shadow:inset 0 0 0 4px var(--dlg-bg),inset 0 0 0 5px rgba(176,138,69,.5),0 16px 36px -18px rgba(0,0,0,.55)}
[data-t="claude"] .plate{border-radius:3px;letter-spacing:.2em}

/* GLM — ink wolf: ink texture, brush stroke, claw marks */
[data-t="glm"] .main{background-image:var(--pat-main)}
[data-t="glm"] .slogan{font-family:"Ma Shan Zheng",var(--f-ui);font-weight:400;font-size:34px;letter-spacing:.04em}
[data-t="glm"] .slogan::after{content:"";display:block;width:168px;height:12px;margin-top:4px;background:var(--orn-brush) left center/contain no-repeat}
[data-t="glm"] .sec::before{content:"";width:14px;height:14px;margin-right:8px;background:var(--orn-claw) center/contain no-repeat;flex:none}
[data-t="glm"] .ni.on::before{border-radius:0;background:var(--a2)}
[data-t="glm"] .plate{border-radius:2px;letter-spacing:.3em}

/* 混元 — snow night, red scarf: ink cloak sidebar with fur trim, pale moon */
[data-t="hunyuan"] .strip{height:3px;background:var(--accent)}
[data-t="hunyuan"] .side{background-image:var(--pat-side);border-right:0}
[data-t="hunyuan"] .side::after{content:"";position:absolute;right:-7px;top:0;bottom:0;width:14px;background:radial-gradient(circle at 7px 6px,#F8FAFC 6px,transparent 6.6px) 0 0/14px 10px repeat-y;filter:drop-shadow(1px 0 0 #CBD3DE)}
[data-t="hunyuan"] .main{background-image:var(--pat-main)}
[data-t="hunyuan"] .content{padding-left:32px}
[data-t="hunyuan"] .hero-art::before{content:"";position:absolute;width:176px;height:176px;right:-4px;top:36px;border-radius:50%;background:color-mix(in srgb,var(--a2) 16%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--a2) 40%,transparent);z-index:-1}

function hexRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function rgbHex(c){return '#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase()}
function mix(a,b,p){const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v*p+y[i]*(1-p)))}
function lum(h){return hexRgb(h).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}

(function injectThemeCSS(){
  let css='';
  for(const t of THEMES){
    let v='';
    for(const [k,val] of Object.entries(t.c)) v+=`${kebab(k)}:${val};`;
    v+=`--r-card:${t.r.card}px;--r-btn:${t.r.btn}px;--r-dlg:${t.r.dlg}px;--f-head:${HEAD[t.id]||'var(--f-ui)'};${EXTRA[t.id]||''}`;
    v+='--pat-main:none;--pat-side:none;';
    const gb=ASSET[`gen/web/${t.id}-bg.webp`], go=ASSET[`gen/web/${t.id}-orn.webp`];
    if(gb) v+=`--gen-bg:url("${gb}");--gen-pos:${GEN_POS[t.id]||'center'};`;
    if(go) v+=`--gen-orn:url("${go}");`+(GEN_SIZE[t.id]?`--gen-w:${GEN_SIZE[t.id][0]}px;--gen-h:${GEN_SIZE[t.id][1]}px;`:'');
    for(const [k,s] of Object.entries(ORN[t.id]||{})) v+=`${k}:${s.startsWith('url(')?s:svgUrl(s)};`;
    css+=`[data-t="${t.id}"]{${v}}\n`;
  }
  const el=document.createElement('style');el.textContent=css;document.head.appendChild(el);
})();

/* ---- picks: db when available, browser storage otherwise ---- */
const LS='aibuddy-theme-picks-r1';
const picks={};
try{Object.assign(picks,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(picks))}catch(e){}};
let db=null, store='pending';
const chains={}, lastSent={};
let current='all';

function setStatus(id,msg){ if(current===id){const el=$('#vstatus');if(el)el.textContent=msg} }
function persist(id){
  saveLocal(); refreshTally();
  if(!db){ setStatus(id,'已存在这个浏览器里。看完点上面的「复制我的选择」发给我。'); return; }
  chains[id]=(chains[id]||Promise.resolve()).then(()=>{
    const p=picks[id]||{}; const body={theme:id,verdict:p.verdict||'',note:p.note||'',ornament:p.ornament||''};
    const key=JSON.stringify(body); if(lastSent[id]===key) return;
    return db.doc('picks/'+id).set({...body,at:Date.now()}).then(()=>{lastSent[id]=key;setStatus(id,'已保存，我这边能直接读到。')});
  }).catch(e=>{ setStatus(id,'云端保存失败（'+(e&&e.code||'unknown')+'），已留在本机浏览器。'); if(e&&e.code==='invalid_argument'){db=null;store='local';storeNote()} });
}
function storeNote(){
  const el=$('#store-note');
  el.textContent = store==='db' ? '选择会自动保存，我这边能直接读到。' : store==='pending' ? '正在连接保存服务…' : '这里连不上云端保存，选择只留在这个浏览器里。看完点「复制我的选择」，把文字发给我。';
}
(async()=>{
  let h=null;
  try{ h = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('db') : null }catch(e){ h=null }
  if(!h){ store='local'; storeNote(); return; }
  db=h; store='db'; storeNote();
  let first=true;
  db.collection('picks').onSnapshot(snap=>{
    const seen=new Set();
    for(const d of snap.docs){
      if(!d.exists||!BY_ID[d.id]) continue; seen.add(d.id);
      const v=d.data()||{}; const editing=document.activeElement&&document.activeElement.id==='note'&&current===d.id;
      picks[d.id]={verdict:v.verdict||'',note:editing?(picks[d.id]||{}).note||'':(v.note||''),ornament:v.ornament||''};
      lastSent[d.id]=JSON.stringify({theme:d.id,verdict:v.verdict||'',note:v.note||'',ornament:v.ornament||''});
    }
    if(first){ first=false; for(const id of Object.keys(picks)) if(!seen.has(id)&&BY_ID[id]&&(picks[id].verdict||picks[id].note||picks[id].ornament)) persist(id); }
    saveLocal(); refreshTally(); refreshVerdict(); applyOrn();
  },()=>{ db=null; store='local'; storeNote(); });
})();

function summaryText(){
  const lines=['AI 酱主题预览 r3 · 我的选择'];
  const none=[];
  for(const t of THEMES){const p=picks[t.id]||{};
    if(!p.verdict&&!p.note&&!p.ornament){none.push(t.name);continue}
    lines.push(`${t.name} ${t.zh}：${p.verdict==='like'?'喜欢':p.verdict==='change'?'要改':'未选'}${p.ornament?'（装饰：'+ornLabel(t.id,p.ornament)+'）':''}${p.note?' —— '+p.note.trim():''}`);}
  if(none.length) lines.push('还没选：'+none.join('、'));
  return lines.join('\n');
}
$('#copy').addEventListener('click',()=>{
  const text=summaryText(); const out=$('#copy-out'); const btn=$('#copy');
  const fallback=()=>{out.hidden=false;out.value=text;out.focus();out.select();btn.textContent='已选中文字，按 Ctrl+C 复制'};
  try{ navigator.clipboard.writeText(text).then(()=>{btn.textContent='已复制';out.hidden=true;setTimeout(()=>btn.textContent='复制我的选择',1800)},fallback) }catch(e){ fallback() }
});
function refreshTally(){
  $('#tally').textContent=THEMES.filter(t=>(picks[t.id]||{}).verdict).length;
  document.querySelectorAll('.sw[data-id]').forEach(a=>{const v=(picks[a.dataset.id]||{}).verdict;a.querySelector('.mk').className='mk '+(v||'')});
  document.querySelectorAll('.ovc[data-id] .vb').forEach(b=>{const v=(picks[b.closest('.ovc').dataset.id]||{}).verdict;b.className='vb '+(v||'');b.textContent=v==='like'?'喜欢':v==='change'?'要改':'未选'});
  const sum=$('#sum-list'); if(sum) sum.innerHTML=sumItems();
}
function refreshVerdict(){
  if(current==='all') return; const p=picks[current]||{};
  document.querySelectorAll('.vbtn').forEach(b=>b.setAttribute('aria-pressed',String(p.verdict===b.dataset.v)));
  document.querySelectorAll('.obtn').forEach(b=>b.setAttribute('aria-checked',String(ornOf(current)===b.dataset.o)));
  const n=$('#note'); if(n&&document.activeElement!==n) n.value=p.note||'';
}
const sumItems=()=>THEMES.map(t=>{const v=(picks[t.id]||{}).verdict;return `<li><span>${esc(t.name)}</span><span>${esc(t.zh)}</span><span>${v==='like'?'喜欢':v==='change'?'要改':'—'}</span></li>`}).join('');

  if(window.ResizeObserver){ if(window._ro) window._ro.disconnect(); window._ro=new ResizeObserver(es=>es.forEach(e=>set(e.target))); frames.forEach(f=>window._ro.observe(f)); }
}

  $('#view').innerHTML = `<section class="ov-grid">` + THEMES.map(t=>`

function renderDetail(t){

  $('#view').innerHTML = `<div class="detail">

      <div class="info-head">${face(t.id)}<div><h2>${esc(t.name)}<small>${esc(t.zh)}</small></h2><span class="mode">${t.mode==='dark'?'暗色':'亮色'} · 标题字体：${esc(t.font)}</span></div></div>
      <p>${esc(t.tagline)}</p>
      <section><h3>你的意见</h3>
        <div class="vbtns"><button class="vbtn" type="button" data-v="like" aria-pressed="false">喜欢</button><button class="vbtn" type="button" data-v="change" aria-pressed="false">要改</button></div>
        <textarea id="note" placeholder="要改的话写一句，比如：强调色再亮一点、装饰少一点" aria-label="修改意见"></textarea>

      </section>${ORN_OPTS[t.id] ? `

      <section><h3>现在 → 新方案</h3>
        <div class="cmp"><span>现在</span><span class="bar">${[t.now.bg,t.now.surface,t.now.accent,t.now.secondary].map(c=>`<i style="background:${c}"></i>`).join('')}</span>

function setViewGen(on){
